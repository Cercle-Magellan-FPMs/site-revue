server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # En-têtes défensifs ; le HTTPS est géré par le reverse proxy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Santé du conteneur (ne dépend d'aucun service extérieur).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Les assets Astro ont un nom versionné : cache long et immuable.
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Les fichiers du dossier public peuvent changer sans changer d'URL.
    location ~* \.(?:svg|png|jpe?g|webp|avif|gif|ico|webmanifest)$ {
        try_files $uri =404;
        expires 1d;
    }

    # Site statique : ne jamais renvoyer l'accueil pour un chemin inconnu.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
}
